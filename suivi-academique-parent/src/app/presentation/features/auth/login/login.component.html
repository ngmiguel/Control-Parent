<div class="login-container">
  <div class="login-card">
    <h2>Suivi Académique</h2>
    <p>Connectez-vous pour suivre vos enfants</p>

    <form [formGroup]="loginForm">
      
      <!-- ÉTAPE 1 : NUMÉRO DE TÉLÉPHONE -->
      <div *ngIf="step === 'PHONE'">
        <label>Numéro de téléphone</label>
        <input type="text" formControlName="phone" placeholder="Ex: (+237) 6 90 12 34 56">
        <p class="hint" *ngIf="loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched">
          Format accepté: (+237) 6XX XX XX XX ou 6XX XX XX XX
        </p>
        <button (click)="onRequestOtp()" [disabled]="loginForm.get('phone')?.invalid || isLoading">
          {{ isLoading ? 'Envoi...' : 'Recevoir le code' }}
        </button>
      </div>

      <!-- ÉTAPE 2 : CODE OTP -->
      <div *ngIf="step === 'OTP'">
        <div class="welcome-message" *ngIf="parentName">
          <p class="welcome-text">Bienvenue</p>
          <p class="parent-name">{{ parentName }}</p>
        </div>
        
        <label>Code de validation (SMS)</label>
        <input 
          type="text" 
          formControlName="code" 
          placeholder="Entrez le code à 6 chiffres"
          maxlength="6"
          (keypress)="onlyNumbers($event)">
        <p class="hint" *ngIf="loginForm.get('code')?.invalid && loginForm.get('code')?.touched">
          Le code doit contenir exactement 6 chiffres
        </p>
        <button (click)="onVerifyOtp()" [disabled]="loginForm.get('code')?.invalid || isLoading">
          {{ isLoading ? 'Vérification...' : 'Valider' }}
        </button>
        <p (click)="step = 'PHONE'" class="back-link">Changer de numéro</p>
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <div class="help-section">
      <p class="help-text">Nouveau numéro ?</p>
      <a href="https://mail.google.com/mail/?view=cm&fs=1&to=zacharie.melongo@saintjeaningenieur.org&su=Demande%20d'ajout%20de%20num%C3%A9ro%20-%20Suivi%20Acad%C3%A9mique&body=Bonjour%2C%0D%0A%0D%0AJe%20souhaite%20ajouter%20mon%20num%C3%A9ro%20de%20t%C3%A9l%C3%A9phone%20pour%20acc%C3%A9der%20au%20suivi%20acad%C3%A9mique%20de%20mes%20enfants.%0D%0A%0D%0AMon%20num%C3%A9ro%20%3A%20%0D%0ANom%20complet%20%3A%20%0D%0ANom(s)%20de(s)%20enfant(s)%20%3A%20%0D%0A%0D%0AMerci."
         class="contact-link" 
         target="_blank">
        Contactez l'administration
      </a>
    </div>
  </div>
</div>
