<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <i data-lucide="graduation-cap"></i>
      </div>
      <h1>Connexion</h1>
      <p class="subtitle">Portail Parents</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error">
        <i data-lucide="alert-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onRequestOtp()" class="login-form">
      <div class="form-group">
        <label for="phone">Numéro de téléphone</label>
        <input 
          id="phone"
          type="tel" 
          formControlName="phone" 
          placeholder="6 90 12 34 56"
          class="form-input">
        @if (loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched) {
          <p class="input-hint">
            <i data-lucide="alert-circle"></i>
            Format attendu : 6XX XX XX XX
          </p>
        }
      </div>

      <button 
        type="submit"
        class="btn btn-primary" 
        [disabled]="loginForm.get('phone')?.invalid || isLoading">
        @if (!isLoading) {
          <span>
            <i data-lucide="send"></i>
            Recevoir le code
          </span>
        }
        @if (isLoading) {
          <span class="loading-spinner">
            <i data-lucide="loader-2"></i>
            Envoi en cours...
          </span>
        }
      </button>
    </form>

    <div class="help-section">
      <a href="https://mail.google.com/mail/?view=cm&fs=1&to=zacharie.melongo@saintjeaningenieur.org&su=Demande%20d'ajout%20de%20num%C3%A9ro&body=Bonjour%2C%0D%0AJe%20souhaite%20ajouter%20mon%20num%C3%A9ro."
         class="help-link" 
         target="_blank">
        <i data-lucide="help-circle"></i>
        Nouveau numéro ?
      </a>
    </div>
  </div>
</div>
