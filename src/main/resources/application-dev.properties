# Configuration pour le développement

# Configuration du serveur
server.port=8080

# Configuration MySQL - Développement
spring.datasource.url=jdbc:mysql://localhost:3306/parent_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Configuration JPA/Hibernate - Plus permissive pour le développement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging détaillé pour le debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.example.backend=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# SMS Configuration
sms.provider=${SMS_PROVIDER}
sms.sender.id=${SMS_SENDER_ID}

# Africa's Talking credentials
sms.africastalking.username=${SMS_AFRICASTALKING_USERNAME}
sms.africastalking.api.key=${SMS_AFRICASTALKING_API_KEY}
sms.africastalking.sender.id=IUSJ

# OTP Configuration
otp.expiration.minutes=15
otp.length=6

# Notifications API Key
notifications.api.key=${NOTIFICATIONS_API_KEY}

# CORS Configuration
cors.allowed-origins=http://localhost:4200,http://localhost:8080