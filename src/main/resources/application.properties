spring.application.name=backend

# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/parent_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=code_secret_miguel_dan_melongo
jwt.expiration=86400000

# SMS Configuration
# Mode: console (développement) ou twilio (production)
sms.provider=console
sms.sender.id=IUSJ

# Twilio Configuration (optionnel - pour SMS rÃ©els)
sms.twilio.account.sid=
sms.twilio.auth.token=
sms.twilio.phone.number=

# OTP Configuration
otp.expiration.minutes=15
otp.length=6

# CORS Configuration (pour Angular en production)
# Ajouter l'URL de production Angular séparée par des virgules
cors.allowed-origins=http://localhost:4200,http://localhost:8080
